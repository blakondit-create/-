<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ASTRA — AI Face Analysis</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
    background:#02030b;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    overflow-x:hidden;
}

.space{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    background:
        radial-gradient(circle at 15% 10%,rgba(75,50,255,.25),transparent 35%),
        radial-gradient(circle at 90% 85%,rgba(0,220,255,.18),transparent 35%),
        #02030b;
}

.stars{
    position:absolute;
    inset:0;
    opacity:.35;
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1.5px),
        radial-gradient(circle,#75cfff 1px,transparent 1.5px);
    background-size:90px 90px,150px 150px;
    animation:stars 30s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(90px)}
}

.app{
    position:relative;
    z-index:2;
    width:min(900px,94%);
    margin:auto;
    padding:28px 0 70px;
}

header{
    text-align:center;
    margin-bottom:22px;
}

.logo{
    font-size:clamp(38px,10vw,72px);
    font-weight:900;
    letter-spacing:12px;
    margin-left:12px;
    background:linear-gradient(
        90deg,
        #fff,
        #76ecff,
        #9b7cff,
        #fff
    );
    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;
    animation:logo 5s linear infinite;
}

@keyframes logo{
    from{background-position:0}
    to{background-position:300%}
}

.subtitle{
    color:#7180a7;
    font-size:10px;
    letter-spacing:5px;
    margin-top:6px;
}

.statusBox{
    padding:17px;
    border-radius:19px;
    background:rgba(10,15,40,.72);
    border:1px solid rgba(120,190,255,.25);
    backdrop-filter:blur(18px);
    margin-bottom:18px;
}

.statusTitle{
    color:#657393;
    font-size:9px;
    letter-spacing:3px;
    margin-bottom:8px;
}

.status{
    color:#70eaff;
    font-size:13px;
    line-height:1.5;
    word-break:break-word;
}

.status.success{
    color:#65ffb1;
}

.status.error{
    color:#ff667e;
}

.upload{
    min-height:240px;
    border-radius:30px;
    border:1px solid rgba(120,200,255,.3);
    background:linear-gradient(
        145deg,
        rgba(35,45,100,.4),
        rgba(5,8,25,.8)
    );
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    cursor:pointer;
    transition:.3s;
}

.upload:hover{
    border-color:#62eaff;
    box-shadow:0 0 45px rgba(0,210,255,.15);
}

.uploadIcon{
    width:70px;
    height:70px;
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    margin-bottom:17px;
    background:rgba(80,130,255,.12);
    border:1px solid rgba(120,190,255,.3);
}

.upload h2{
    font-size:21px;
    margin-bottom:7px;
}

.upload p{
    color:#7180a2;
    font-size:13px;
}

#file{
    display:none;
}

.photoBox{
    display:none;
    margin-top:22px;
    border-radius:28px;
    overflow:hidden;
    background:#000;
    border:1px solid rgba(120,190,255,.25);
}

.photoBox.show{
    display:block;
}

.photoWrap{
    position:relative;
    width:100%;
}

#photo{
    display:block;
    width:100%;
    height:auto;
    max-height:75vh;
    object-fit:contain;
}

#landmarkCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.scanLine{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:3px;
    opacity:0;
    background:linear-gradient(
        90deg,
        transparent,
        #54efff,
        #fff,
        #54efff,
        transparent
    );
    box-shadow:
        0 0 12px #54efff,
        0 0 35px #008cff;
}

.scanLine.active{
    opacity:1;
    animation:scan 2.3s ease-in-out infinite;
}

@keyframes scan{
    0%{top:0}
    50%{top:100%}
    100%{top:0}
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:17px;
}

button{
    border:0;
    border-radius:17px;
    padding:17px 20px;
    color:#fff;
    font-weight:800;
    letter-spacing:2px;
    font-size:12px;
    cursor:pointer;
}

#rate{
    flex:1;
    background:linear-gradient(100deg,#694cff,#00cfff);
}

#rate:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#reset{
    width:130px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
}

.results{
    display:none;
    margin-top:22px;
    gap:13px;
}

.results.show{
    display:grid;
    grid-template-columns:repeat(2,1fr);
}

.card{
    padding:19px;
    border-radius:21px;
    border:1px solid rgba(120,180,255,.2);
    background:rgba(10,15,38,.72);
    backdrop-filter:blur(18px);
}

.cardTitle{
    color:#7180a5;
    font-size:9px;
    letter-spacing:3px;
    margin-bottom:8px;
}

.cardValue{
    color:#9cefff;
    font-size:23px;
    font-weight:800;
}

.cardText{
    color:#b6c0d8;
    font-size:13px;
    line-height:1.5;
}

.tech{
    margin-top:18px;
    padding:16px;
    border-radius:17px;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.06);
    color:#62708d;
    font-size:10px;
    line-height:1.6;
}

@media(max-width:650px){

    .app{
        width:92%;
        padding-top:18px;
    }

    .logo{
        letter-spacing:7px;
    }

    .buttons{
        flex-direction:column;
    }

    #reset{
        width:100%;
    }

    .results.show{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="space">
    <div class="stars"></div>
</div>

<main class="app">

<header>
    <div class="logo">ASTRA</div>
    <div class="subtitle">
        AI FACE LANDMARK ANALYSIS
    </div>
</header>

<div class="statusBox">
    <div class="statusTitle">
        SYSTEM STATUS
    </div>

    <div id="status" class="status">
        STARTING...
    </div>
</div>

<label class="upload" for="file">

    <div class="uploadIcon">＋</div>

    <h2>UPLOAD PHOTO</h2>

    <p>Choose a clear face photo</p>

    <input
        id="file"
        type="file"
        accept="image/*"
    >

</label>

<section id="photoBox" class="photoBox">

    <div class="photoWrap">

        <img
            id="photo"
            alt="Uploaded photo"
        >

        <canvas id="landmarkCanvas"></canvas>

        <div
            id="scanLine"
            class="scanLine"
        ></div>

    </div>

</section>

<div class="buttons">

    <button
        id="rate"
        disabled
    >
        RATE / ANALYZE
    </button>

    <button id="reset">
        RESET
    </button>

</div>

<section id="results" class="results">

    <div class="card">
        <div class="cardTitle">FACE STRUCTURE</div>
        <div id="structure" class="cardValue">—</div>
    </div>

    <div class="card">
        <div class="cardTitle">FACE WIDTH</div>
        <div id="widthType" class="cardValue">—</div>
    </div>

    <div class="card">
        <div class="cardTitle">SYMMETRY</div>
        <div id="symmetry" class="cardValue">—</div>
    </div>

    <div class="card">
        <div class="cardTitle">ANALYSIS CONFIDENCE</div>
        <div id="confidence" class="cardValue">—</div>
    </div>

    <div class="card">
        <div class="cardTitle">EYES</div>
        <div id="eyes" class="cardText">—</div>
    </div>

    <div class="card">
        <div class="cardTitle">LIPS</div>
        <div id="lips" class="cardText">—</div>
    </div>

    <div class="card">
        <div class="cardTitle">BROWS</div>
        <div id="brows" class="cardText">—</div>
    </div>

    <div class="card">
        <div class="cardTitle">CONTOUR</div>
        <div id="contour" class="cardText">—</div>
    </div>

</section>

<div class="tech">
    <b>ASTRA TECH</b><br>
    MediaPipe Face Landmarker • Landmark-based visual analysis
</div>

</main>


<!-- =====================================================
     IMPORTANT:
     Everything below is ONE ES MODULE.
===================================================== -->

<script type="module">

import {
    FaceLandmarker,
    FilesetResolver
} from "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";


/* =====================================================
   ELEMENTS
===================================================== */

const statusEl =
    document.getElementById("status");

const fileInput =
    document.getElementById("file");

const photoBox =
    document.getElementById("photoBox");

const photo =
    document.getElementById("photo");

const canvas =
    document.getElementById("landmarkCanvas");

const ctx =
    canvas.getContext("2d");

const scanLine =
    document.getElementById("scanLine");

const rateButton =
    document.getElementById("rate");

const resetButton =
    document.getElementById("reset");

const results =
    document.getElementById("results");


let faceLandmarker = null;

let aiReady = false;

let selectedImage = false;


/* =====================================================
   STATUS
===================================================== */

function status(message,type=""){

    statusEl.textContent = message;

    statusEl.className = "status";

    if(type){
        statusEl.classList.add(type);
    }

    console.log("[ASTRA]",message);
}


/* =====================================================
   START AI
===================================================== */

async function startAI(){

    try{

        status(
            "1/4 — MEDIAPIPE LIBRARY LOADED ✓",
            "success"
        );


        /* ---------------------------------------------
           WASM
        --------------------------------------------- */

        status(
            "2/4 — LOADING AI ENGINE..."
        );

        const vision =
            await FilesetResolver.forVisionTasks(
                "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm"
            );


        status(
            "2/4 — AI ENGINE LOADED ✓",
            "success"
        );


        /* ---------------------------------------------
           MODEL CHECK
        --------------------------------------------- */

        status(
            "3/4 — CHECKING FACE MODEL..."
        );

        const modelResponse =
            await fetch(
                "./face_landmarker.task",
                {
                    method:"HEAD",
                    cache:"no-store"
                }
            );

        if(!modelResponse.ok){

            throw new Error(
                "face_landmarker.task not found. HTTP " +
                modelResponse.status
            );
        }


        status(
            "3/4 — FACE MODEL FOUND ✓",
            "success"
        );


        /* ---------------------------------------------
           CREATE LANDMARKER
        --------------------------------------------- */

        status(
            "4/4 — STARTING FACE AI..."
        );

        faceLandmarker =
            await FaceLandmarker.createFromOptions(
                vision,
                {
                    baseOptions:{
                        modelAssetPath:
                            "./face_landmarker.task",

                        delegate:"CPU"
                    },

                    runningMode:"IMAGE",

                    numFaces:1,

                    minFaceDetectionConfidence:.5,

                    minFacePresenceConfidence:.5,

                    minTrackingConfidence:.5
                }
            );


        aiReady = true;


        status(
            "AI READY ✓ — UPLOAD A PHOTO",
            "success"
        );


        if(selectedImage){

            rateButton.disabled = false;

        }


    }catch(error){

        console.error(
            "ASTRA AI ERROR:",
            error
        );

        status(
            "AI ERROR: " +
            getErrorMessage(error),
            "error"
        );

    }
}


/* =====================================================
   ERROR
===================================================== */

function getErrorMessage(error){

    if(!error){
        return "Unknown error";
    }

    if(error.message){
        return error.message;
    }

    return String(error);
}


/* =====================================================
   FILE
===================================================== */

fileInput.addEventListener(
    "change",
    function(){

        const file =
            this.files?.[0];

        if(!file){
            return;
        }


        if(!file.type.startsWith("image/")){

            status(
                "PHOTO ERROR: Please select an image.",
                "error"
            );

            return;
        }


        status(
            "LOADING PHOTO..."
        );


        const url =
            URL.createObjectURL(file);


        photo.onload = function(){

            URL.revokeObjectURL(url);

            selectedImage = true;

            photoBox.classList.add("show");

            resizeCanvas();

            rateButton.disabled =
                !aiReady;


            if(aiReady){

                status(
                    "PHOTO READY — PRESS RATE",
                    "success"
                );

            }else{

                status(
                    "PHOTO READY — AI STILL LOADING..."
                );

            }

        };


        photo.onerror = function(){

            URL.revokeObjectURL(url);

            status(
                "PHOTO ERROR: Could not read image.",
                "error"
            );

        };


        photo.src = url;

    }
);


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    if(!photo.naturalWidth){
        return;
    }


    const rect =
        photo.getBoundingClientRect();


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        Math.round(rect.width*dpr);

    canvas.height =
        Math.round(rect.height*dpr);


    canvas.style.width =
        rect.width+"px";

    canvas.style.height =
        rect.height+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   RATE
===================================================== */

rateButton.addEventListener(
    "click",
    async function(){

        if(!aiReady){

            status(
                "AI IS NOT READY YET.",
                "error"
            );

            return;
        }


        if(!selectedImage){

            status(
                "UPLOAD A PHOTO FIRST.",
                "error"
            );

            return;
        }


        rateButton.disabled = true;

        results.classList.remove("show");

        scanLine.classList.add("active");


        try{

            status(
                "SCANNING FACE..."
            );

            await sleep(1700);


            status(
                "DETECTING FACE LANDMARKS..."
            );


            const detection =
                faceLandmarker.detect(photo);


            if(
                !detection ||
                !detection.faceLandmarks ||
                detection.faceLandmarks.length===0
            ){

                throw new Error(
                    "NO FACE DETECTED — use a clear photo with one visible face."
                );
            }


            const landmarks =
                detection.faceLandmarks[0];


            status(
                "FACE DETECTED — DRAWING ANALYSIS...",
                "success"
            );


            drawFace(landmarks);

            analyzeFace(landmarks);


            results.classList.add("show");


            status(
                "ANALYSIS COMPLETE ✓",
                "success"
            );


        }catch(error){

            console.error(
                "ANALYSIS ERROR:",
                error
            );


            status(
                "ANALYSIS ERROR: " +
                getErrorMessage(error),
                "error"
            );


        }finally{

            scanLine.classList.remove("active");

            rateButton.disabled = false;

        }

    }
);


/* =====================================================
   LANDMARK POINT
===================================================== */

function point(landmarks,index){

    const p =
        landmarks[index];

    if(!p){
        return null;
    }


    return {

        x:p.x*photo.clientWidth,

        y:p.y*photo.clientHeight

    };
}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(points){

    const valid =
        points.filter(Boolean);


    if(valid.length<2){
        return;
    }


    ctx.beginPath();


    ctx.moveTo(
        valid[0].x,
        valid[0].y
    );


    for(
        let i=1;
        i<valid.length;
        i++
    ){

        ctx.lineTo(
            valid[i].x,
            valid[i].y
        );

    }


    ctx.stroke();
}


/* =====================================================
   DRAW FACE
===================================================== */

function drawFace(landmarks){

    resizeCanvas();


    ctx.clearRect(
        0,
        0,
        photo.clientWidth,
        photo.clientHeight
    );


    ctx.lineWidth = 1.5;

    ctx.strokeStyle =
        "rgba(70,235,255,.95)";

    ctx.fillStyle =
        "rgba(70,235,255,.95)";


    /* FACE */

    const contour = [

        10,338,297,332,284,251,
        389,356,454,323,361,288,
        397,365,379,378,400,377,
        152,148,176,149,150,136,
        172,58,132,93,234,127,
        162,21,54,103,67,109,10

    ];


    drawLine(
        contour.map(
            i=>point(landmarks,i)
        )
    );


    /* LEFT EYE */

    const leftEye = [

        33,133,160,159,158,157,
        173,153,144,145,23,33

    ];


    drawLine(
        leftEye.map(
            i=>point(landmarks,i)
        )
    );


    /* RIGHT EYE */

    const rightEye = [

        362,263,387,386,385,384,
        398,373,380,374,362

    ];


    drawLine(
        rightEye.map(
            i=>point(landmarks,i)
        )
    );


    /* LIPS */

    const lips = [

        61,146,91,181,84,17,
        314,405,321,375,291,308,
        324,318,402,317,14,87,
        178,88,95,78,61

    ];


    drawLine(
        lips.map(
            i=>point(landmarks,i)
        )
    );


    /* NOSE */

    drawLine([

        point(landmarks,168),
        point(landmarks,6),
        point(landmarks,197),
        point(landmarks,195)

    ]);


    /* BROWS */

    drawLine([

        point(landmarks,70),
        point(landmarks,63),
        point(landmarks,105),
        point(landmarks,66),
        point(landmarks,107)

    ]);


    drawLine([

        point(landmarks,336),
        point(landmarks,296),
        point(landmarks,334),
        point(landmarks,293),
        point(landmarks,300)

    ]);


    /* CENTER */

    ctx.strokeStyle =
        "rgba(255,255,255,.32)";

    ctx.setLineDash([5,7]);


    drawLine([

        point(landmarks,10),
        point(landmarks,168),
        point(landmarks,6),
        point(landmarks,152)

    ]);


    ctx.setLineDash([]);


    /* DOTS */

    const dots = [

        10,152,
        234,454,
        33,133,
        362,263,
        61,291,
        70,300,
        168,6

    ];


    for(const index of dots){

        const p =
            point(landmarks,index);


        if(!p){
            continue;
        }


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );


        ctx.fill();

    }
}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.sqrt(

        Math.pow(a.x-b.x,2) +

        Math.pow(a.y-b.y,2)

    );
}


/* =====================================================
   ANALYSIS
===================================================== */

function analyzeFace(landmarks){

    const top =
        point(landmarks,10);

    const bottom =
        point(landmarks,152);

    const left =
        point(landmarks,234);

    const right =
        point(landmarks,454);


    if(!top || !bottom || !left || !right){

        throw new Error(
            "Required landmarks were not detected."
        );
    }


    const height =
        distance(top,bottom);

    const width =
        distance(left,right);


    const ratio =
        height/width;


    let structure;


    if(ratio>1.48){

        structure="LONG";

    }else if(ratio<1.10){

        structure="BROAD";

    }else{

        structure="BALANCED";
    }


    let widthType;


    if(width<photo.clientWidth*.28){

        widthType="NARROW";

    }else if(width>photo.clientWidth*.58){

        widthType="WIDE";

    }else{

        widthType="MEDIUM";
    }


    document.getElementById(
        "structure"
    ).textContent =
        structure;


    document.getElementById(
        "widthType"
    ).textContent =
        widthType;


    document.getElementById(
        "symmetry"
    ).textContent =
        "LANDMARKS DETECTED";


    document.getElementById(
        "confidence"
    ).textContent =
        "HIGH";


    document.getElementById(
        "eyes"
    ).textContent =
        "Eye landmarks detected and outlined.";


    document.getElementById(
        "lips"
    ).textContent =
        "Lip landmarks detected and outlined.";


    document.getElementById(
        "brows"
    ).textContent =
        "Eyebrow landmarks detected.";


    document.getElementById(
        "contour"
    ).textContent =
        "Facial contour landmarks detected.";
}


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
    "click",
    function(){

        fileInput.value = "";

        photo.src = "";

        selectedImage = false;

        photoBox.classList.remove("show");

        results.classList.remove("show");

        scanLine.classList.remove("active");


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        rateButton.disabled = true;


        if(aiReady){

            status(
                "AI READY ✓ — UPLOAD A PHOTO",
                "success"
            );

        }else{

            status(
                "AI IS LOADING..."
            );
        }

    }
);


/* =====================================================
   SLEEP
===================================================== */

function sleep(ms){

    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );
}


/* =====================================================
   START
===================================================== */

startAI();

</script>

</body>
</html>
