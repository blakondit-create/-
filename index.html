<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASTRA — Face Analysis</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:#02030b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 5%,rgba(90,100,255,.25),transparent 30%),
        radial-gradient(circle at 10% 80%,rgba(0,220,255,.10),transparent 30%),
        radial-gradient(circle at 90% 70%,rgba(170,60,255,.12),transparent 30%),
        #02030b;
}

#stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.5;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15}
    to{opacity:.9}
}

.app{
    position:relative;
    z-index:2;
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:25px 15px 60px;
}

header{
    text-align:center;
}

.logo{
    color:#8e9aff;
    font-size:11px;
    letter-spacing:6px;
    margin-bottom:10px;
}

h1{
    margin:0;
    font-size:clamp(48px,12vw,90px);
    letter-spacing:10px;
    background:linear-gradient(
        90deg,
        #fff,
        #91a1ff,
        #e5e8ff,
        #fff
    );
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    color:#777f9e;
    font-size:10px;
    letter-spacing:3px;
    margin-top:10px;
}

.status{
    display:inline-block;
    margin:20px auto;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid rgba(130,145,255,.3);
    background:rgba(20,25,55,.6);
    color:#a0aaff;
    font-size:9px;
    letter-spacing:2px;
}

.status.ready{
    color:#6fffd0;
    border-color:rgba(70,255,200,.4);
}

.upload-zone{
    min-height:260px;
    border:1px solid rgba(140,150,255,.25);
    border-radius:30px;
    background:rgba(8,12,30,.8);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
    position:relative;
}

.upload-zone:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            transparent 49.8%,
            rgba(100,120,255,.06) 50%,
            transparent 50.2%
        ),
        linear-gradient(
            0deg,
            transparent 49.8%,
            rgba(100,120,255,.06) 50%,
            transparent 50.2%
        );
    background-size:40px 40px;
}

.upload-content{
    position:relative;
    z-index:2;
}

.upload-icon{
    font-size:45px;
    margin-bottom:12px;
}

.upload-title{
    font-size:18px;
    font-weight:bold;
    letter-spacing:4px;
}

.upload-small{
    color:#68708e;
    font-size:10px;
    letter-spacing:2px;
    margin-top:8px;
}

.upload-button{
    display:inline-block;
    margin-top:22px;
    padding:15px 26px;
    border-radius:14px;
    background:linear-gradient(135deg,#6374ff,#9958ff);
    box-shadow:0 0 30px rgba(100,100,255,.3);
    font-size:10px;
    font-weight:bold;
    letter-spacing:3px;
    cursor:pointer;
}

#file{
    display:none;
}

.photo-section{
    display:none;
    margin-top:25px;
}

.photo-box{
    position:relative;
    width:100%;
    max-width:700px;
    margin:auto;
    overflow:hidden;
    border-radius:28px;
    background:#050711;
    border:1px solid rgba(140,150,255,.3);
    box-shadow:0 0 70px rgba(60,70,255,.15);
}

#photo{
    display:block;
    width:100%;
    height:auto;
    max-height:70vh;
    object-fit:contain;
}

#landmarkCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.scan-line{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:3px;
    opacity:0;
    background:linear-gradient(
        90deg,
        transparent,
        #6fffff,
        #fff,
        #6fffff,
        transparent
    );
    box-shadow:
        0 0 12px #6fffff,
        0 0 35px #526eff;
}

.scanning .scan-line{
    opacity:1;
    animation:scan 2.5s ease-in-out infinite;
}

@keyframes scan{
    0%{top:0}
    50%{top:100%}
    100%{top:0}
}

.controls{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:18px;
}

button{
    border:0;
    color:white;
    cursor:pointer;
    border-radius:14px;
    padding:16px 25px;
    font-size:10px;
    font-weight:bold;
    letter-spacing:3px;
}

.rate{
    background:linear-gradient(135deg,#6878ff,#9d58ff);
    box-shadow:0 0 35px rgba(100,90,255,.3);
}

.rate:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.reset{
    background:#161a30;
    border:1px solid rgba(150,160,255,.2);
}

.results{
    display:none;
    margin-top:28px;
}

.results-title{
    text-align:center;
    color:#858ead;
    font-size:10px;
    letter-spacing:4px;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.card{
    padding:20px;
    min-height:105px;
    border-radius:20px;
    background:rgba(15,20,45,.75);
    border:1px solid rgba(140,150,255,.16);
}

.card-label{
    color:#69718e;
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:12px;
}

.card-value{
    font-size:16px;
    font-weight:bold;
}

.confidence{
    grid-column:1/-1;
    text-align:center;
}

.confidence .number{
    font-size:50px;
    font-weight:900;
    background:linear-gradient(90deg,#72eaff,#9d7aff);
    -webkit-background-clip:text;
    color:transparent;
}

.confidence p{
    color:#69718e;
    font-size:8px;
    letter-spacing:2px;
}

@media(max-width:650px){

    .app{
        padding:18px 12px 45px;
    }

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .confidence{
        grid-column:1/-1;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<main class="app">

<header>

    <div class="logo">
        ASTRA // VISION SYSTEM
    </div>

    <h1>ASTRA</h1>

    <div class="subtitle">
        NEURAL FACE LANDMARK ANALYSIS
    </div>

    <div class="status" id="status">
        AI STARTING...
    </div>

</header>

<section class="upload-zone" id="uploadZone">

    <div class="upload-content">

        <div class="upload-icon">✦</div>

        <div class="upload-title">
            UPLOAD PHOTO
        </div>

        <div class="upload-small">
            JPG / PNG / WEBP • FACE SHOULD BE VISIBLE
        </div>

        <label class="upload-button" for="file">
            SELECT PHOTO
        </label>

        <input
            id="file"
            type="file"
            accept="image/*"
        >

    </div>

</section>

<section class="photo-section" id="photoSection">

    <div class="photo-box" id="photoBox">

        <img id="photo" alt="Uploaded photo">

        <canvas id="landmarkCanvas"></canvas>

        <div class="scan-line"></div>

    </div>

    <div class="controls">

        <button
            class="rate"
            id="rateButton"
            disabled
        >
            RATE
        </button>

        <button
            class="reset"
            id="resetButton"
        >
            NEW PHOTO
        </button>

    </div>

</section>

<section class="results" id="results">

    <div class="results-title">
        FACE LANDMARK REPORT
    </div>

    <div class="grid">

        <div class="card">
            <div class="card-label">
                FACE STRUCTURE
            </div>
            <div class="card-value" id="faceShape">
                —
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                EYE REGION
            </div>
            <div class="card-value" id="eyesInfo">
                —
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                LIP REGION
            </div>
            <div class="card-value" id="lipsInfo">
                —
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                BROW REGION
            </div>
            <div class="card-value" id="browsInfo">
                —
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                SYMMETRY
            </div>
            <div class="card-value" id="symmetryInfo">
                —
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                LANDMARKS
            </div>
            <div class="card-value" id="landmarkInfo">
                —
            </div>
        </div>

        <div class="card confidence">

            <div class="card-label">
                ANALYSIS CONFIDENCE
            </div>

            <div class="number" id="confidence">
                —
            </div>

            <p>
                TECHNICAL DETECTION CONFIDENCE
            </p>

        </div>

    </div>

</section>

</main>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const fileInput =
    document.getElementById("file");

const uploadZone =
    document.getElementById("uploadZone");

const photoSection =
    document.getElementById("photoSection");

const photoBox =
    document.getElementById("photoBox");

const photo =
    document.getElementById("photo");

const canvas =
    document.getElementById("landmarkCanvas");

const rateButton =
    document.getElementById("rateButton");

const resetButton =
    document.getElementById("resetButton");

const results =
    document.getElementById("results");

const status =
    document.getElementById("status");

let faceLandmarker = null;
let aiReady = false;
let selectedImage = false;


/* =====================================================
   STARS
===================================================== */

const stars =
    document.getElementById("stars");

for(let i=0;i<130;i++){

    const star =
        document.createElement("div");

    star.className="star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.animationDelay =
        Math.random()*3+"s";

    stars.appendChild(star);
}


/* =====================================================
   PHOTO UPLOAD
===================================================== */

fileInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }

        if(!file.type.startsWith("image/")){
            status.textContent =
                "INVALID IMAGE";
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                photo.onload =
                    function(){

                        selectedImage=true;

                        uploadZone.style.display=
                            "none";

                        photoSection.style.display=
                            "block";

                        rateButton.disabled=false;

                        results.style.display=
                            "none";

                        clearCanvas();

                        resizeCanvas();

                        if(aiReady){

                            status.textContent =
                                "AI READY • PHOTO READY";

                        }else{

                            status.textContent =
                                "PHOTO READY • AI LOADING";

                        }
                    };

                photo.src =
                    event.target.result;
            };

        reader.readAsDataURL(file);
    }
);


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    if(!photo.naturalWidth){
        return;
    }

    const rect =
        photo.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width*dpr;

    canvas.height =
        rect.height*dpr;

    canvas.style.width =
        rect.width+"px";

    canvas.style.height =
        rect.height+"px";
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   LOAD AI
===================================================== */

async function loadAI(){

    try{

        status.textContent =
            "AI LOADING...";

        /*
         * MediaPipe library
         */

        const mp =
            await import(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
            );

        const FaceLandmarker =
            mp.FaceLandmarker;

        const FilesetResolver =
            mp.FilesetResolver;

        /*
         * WASM engine
         */

        const vision =
            await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
            );

        /*
         * IMPORTANT:
         * The AI model is stored NEXT TO index.html
         */

        faceLandmarker =
            await FaceLandmarker.createFromOptions(
                vision,
                {
                    baseOptions:{
                        modelAssetPath:
                            "./face_landmarker.task",

                        delegate:"GPU"
                    },

                    runningMode:"IMAGE",

                    numFaces:1,

                    minFaceDetectionConfidence:.5,

                    minFacePresenceConfidence:.5,

                    minTrackingConfidence:.5
                }
            );

        aiReady=true;

        status.textContent =
            selectedImage
            ? "AI READY • PHOTO READY"
            : "AI READY";

        status.classList.add("ready");

        console.log(
            "ASTRA: AI READY"
        );

    }catch(error){

        console.error(
            "ASTRA AI ERROR:",
            error
        );

        aiReady=false;

        status.textContent =
            "AI ERROR — CHECK MODEL FILE";

    }
}


/*
 * START AI IMMEDIATELY
 */

loadAI();


/* =====================================================
   RATE
===================================================== */

rateButton.addEventListener(
    "click",
    async function(){

        if(!selectedImage){
            return;
        }

        if(!aiReady ||
           !faceLandmarker){

            status.textContent =
                "AI STILL LOADING...";

            return;
        }

        rateButton.disabled=true;

        photoBox.classList.add(
            "scanning"
        );

        results.style.display=
            "none";

        clearCanvas();

        status.textContent =
            "SCANNING FACE...";

        await wait(1200);

        try{

            const detection =
                faceLandmarker.detect(
                    photo
                );

            if(
                !detection ||
                !detection.faceLandmarks ||
                detection.faceLandmarks.length===0
            ){

                throw new Error(
                    "NO FACE"
                );
            }

            const landmarks =
                detection.faceLandmarks[0];

            drawFace(landmarks);

            analyzeFace(landmarks);

            results.style.display=
                "block";

            status.textContent =
                "ANALYSIS COMPLETE";

            status.classList.add(
                "ready"
            );

        }catch(error){

            console.error(error);

            status.textContent =
                "NO FACE DETECTED";

        }

        photoBox.classList.remove(
            "scanning"
        );

        rateButton.disabled=false;
    }
);


/* =====================================================
   DRAW FACE
===================================================== */

function drawFace(landmarks){

    resizeCanvas();

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
     * General landmark connections
     */

    ctx.strokeStyle =
        "rgba(90,220,255,.35)";

    ctx.lineWidth =
        Math.max(
            1,
            canvas.width/700
        );

    for(
        let i=0;
        i<landmarks.length-1;
        i++
    ){

        const a =
            landmarks[i];

        const b =
            landmarks[i+1];

        ctx.beginPath();

        ctx.moveTo(
            a.x*canvas.width,
            a.y*canvas.height
        );

        ctx.lineTo(
            b.x*canvas.width,
            b.y*canvas.height
        );

        ctx.stroke();
    }

    /*
     * Eyes
     */

    drawLoop(
        landmarks,
        [
            33,133,159,145,153,144,163
        ],
        "#72eaff"
    );

    drawLoop(
        landmarks,
        [
            263,362,386,374,380,373,390
        ],
        "#72eaff"
    );

    /*
     * Lips
     */

    drawLoop(
        landmarks,
        [
            61,146,91,181,84,17,
            314,405,321,375,291
        ],
        "#ff83df"
    );

    /*
     * Brows
     */

    drawLoop(
        landmarks,
        [
            70,63,105,66,107,55,65
        ],
        "#a995ff"
    );

    drawLoop(
        landmarks,
        [
            300,293,334,296,336,285,295
        ],
        "#a995ff"
    );

    /*
     * Face outline
     */

    drawLoop(
        landmarks,
        [
            10,338,297,332,284,251,
            389,356,454,323,361,288,
            397,365,379,152,148,176,
            149,150,136,172,58,132,
            93,234,127,162,21,54,
            103,67,109,10
        ],
        "#648fff"
    );

    /*
     * Important points
     */

    const points=[
        10,152,33,263,
        61,291,70,300,
        234,454
    ];

    ctx.fillStyle="#fff";

    for(
        const index of points
    ){

        const p =
            landmarks[index];

        if(!p) continue;

        ctx.beginPath();

        ctx.arc(
            p.x*canvas.width,
            p.y*canvas.height,
            Math.max(
                2,
                canvas.width/180
            ),
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


function drawLoop(
    landmarks,
    indexes,
    color
){

    const ctx =
        canvas.getContext("2d");

    ctx.strokeStyle=color;

    ctx.lineWidth=
        Math.max(
            1.3,
            canvas.width/550
        );

    ctx.beginPath();

    indexes.forEach(
        (index,i)=>{

            const p=
                landmarks[index];

            if(!p) return;

            const x=
                p.x*canvas.width;

            const y=
                p.y*canvas.height;

            if(i===0){

                ctx.moveTo(x,y);

            }else{

                ctx.lineTo(x,y);

            }
        }
    );

    ctx.stroke();
}


/* =====================================================
   ANALYSIS
===================================================== */

function analyzeFace(lm){

    const top=lm[10];
    const chin=lm[152];

    const left=lm[234];
    const right=lm[454];

    const height=
        distance(top,chin);

    const width=
        distance(left,right);

    const ratio=
        height/
        Math.max(width,.001);

    let shape;

    if(ratio>1.55){

        shape="LONG / OVAL";

    }else if(ratio<1.25){

        shape="BROAD / ROUND";

    }else{

        shape="BALANCED OVAL";
    }

    document.getElementById(
        "faceShape"
    ).textContent=shape;


    /*
     * Symmetry
     */

    const pairs=[
        [33,263],
        [133,362],
        [61,291],
        [70,300],
        [105,334],
        [234,454]
    ];

    let error=0;

    for(
        const pair of pairs
    ){

        const a=lm[pair[0]];
        const b=lm[pair[1]];

        if(!a||!b) continue;

        const center=
            (left.x+right.x)/2;

        const da=
            Math.abs(a.x-center);

        const db=
            Math.abs(b.x-center);

        error+=
            Math.abs(da-db);
    }

    error/=pairs.length;

    const symmetry=
        Math.max(
            0,
            Math.min(
                100,
                Math.round(
                    100-error*500
                )
            )
        );

    document.getElementById(
        "symmetryInfo"
    ).textContent=
        symmetry+"%";


    /*
     * Technical confidence.
     * NOT an attractiveness score.
     */

    const confidence=
        Math.round(
            Math.min(
                99,
                Math.max(
                    70,
                    70+symmetry*.29
                )
            )
        );

    document.getElementById(
        "confidence"
    ).textContent=
        confidence+"%";

    document.getElementById(
        "landmarkInfo"
    ).textContent=
        lm.length+" POINTS";

    document.getElementById(
        "eyesInfo"
    ).textContent=
        "DETECTED";

    document.getElementById(
        "lipsInfo"
    ).textContent=
        "DETECTED";

    document.getElementById(
        "browsInfo"
    ).textContent=
        "DETECTED";
}


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
    "click",
    function(){

        fileInput.value="";

        photo.src="";

        selectedImage=false;

        uploadZone.style.display=
            "flex";

        photoSection.style.display=
            "none";

        results.style.display=
            "none";

        rateButton.disabled=true;

        clearCanvas();

        status.textContent=
            aiReady
            ? "AI READY"
            : "AI LOADING...";
    }
);


/* =====================================================
   HELPERS
===================================================== */

function distance(a,b){

    const dx=a.x-b.x;
    const dy=a.y-b.y;

    return Math.sqrt(
        dx*dx+dy*dy
    );
}


function clearCanvas(){

    const ctx=
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


function wait(ms){

    return new Promise(
        resolve=>
            setTimeout(resolve,ms)
    );
}

</script>

</body>
</html>
